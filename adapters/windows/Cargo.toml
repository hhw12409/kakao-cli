[package]
name = "kakao-windows-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "kakao-cli Windows adapter: drives the KakaoTalk Windows app via UI Automation (windows-rs)."

[[bin]]
name = "kakao-windows-bridge"
path = "src/main.rs"

[lib]
name = "kakao_windows_bridge"
path = "src/lib.rs"

[dependencies]
kakao-contract = { path = "../../crates/kakao-contract" }
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
